version: 2
updates:
  # 生产依赖：分组，一个月看一次就够
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - dependencies

  # GitHub Actions 单独跟，安全修复通常落在这里
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
