name: 功能建议
description: 想要一个新能力，或者觉得某个地方该改。
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提之前先看两条底线：

        1. **不会加任何删除文件的功能。** 不是默认关闭，是根本不会写。
        2. **不会把红线做成可配置项。**

        如果你的建议跟这两条冲突，基本可以直接放弃了。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说问题，再说方案。直接说「加个 XX 功能」很难讨论。
      placeholder: |
        我经常需要把聊天的内容整理下来，但现在只能手动复制……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想到的做法
      description: 有想法就写，没有也行。
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 现在你是怎么绕过去的？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - 语音（识别 / 合成 / 打断）
        - 模型接入
        - 工具执行
        - 人格与记忆
        - 界面
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过已有的 issue，没有重复的
          required: true
        - label: 这个建议不涉及删除文件，也不要求把红线做成开关
          required: true
